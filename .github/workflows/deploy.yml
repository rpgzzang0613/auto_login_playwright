name: Build and Deploy Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/rpgzzang0613/auto_login_playwright
  GCP_PROJECT_ID: auto-login-playwright
  GCP_REGION: asia-northeast3
  CLOUD_RUN_JOB: auto-login-playwright

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/656593331073/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: auto-login-deploy@auto-login-playwright.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update $CLOUD_RUN_JOB \
            --image=$IMAGE_NAME:$GITHUB_SHA \
            --region=$GCP_REGION \
            --project=$GCP_PROJECT_ID \
            --quiet

      - name: Delete old GHCR images
        uses: actions/github-script@v9
        with:
          script: |
            const username = context.repo.owner;
            const packageName = 'auto_login_playwright';

            // GHCR package 버전 전체 조회
            const versions = await github.paginate(
              'GET /users/{username}/packages/{package_type}/{package_name}/versions',
              {
                username,
                package_type: 'container',
                package_name: packageName,
                per_page: 100
              }
            );

            // 태그가 붙은 실제 배포 이미지 버전만 대상으로 함
            const taggedVersions = versions
              .filter(version =>
                version.metadata?.container?.tags?.length > 0
              )
              .sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              );

            // 최신 2개는 유지
            const versionsToDelete = taggedVersions.slice(2);

            for (const version of versionsToDelete) {
              console.log(
                `Delete version: ${version.id}, tags: ${version.metadata.container.tags.join(', ')}`
              );

              await github.request(
                'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                {
                  username,
                  package_type: 'container',
                  package_name: packageName,
                  package_version_id: version.id
                }
              );
            }
